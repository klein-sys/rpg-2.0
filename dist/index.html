<style>

<body>
<main id="game" aria-label="Slopefall game">
<canvas id="scene" aria-label="Top-down ruins with a two-part bridge"></canvas>
<div id="hud" hidden><div id="objective" class="chip"><div class="tag" id="zone"></div><div id="goal"></div></div><div class="chip"><div id="hp"></div><div id="skill-state"></div></div><button id="pause" aria-label="Pause game">Pause</button></div>
<div id="status" class="chip" hidden><div id="prompt"></div><div id="notice"></div><div id="hints">WASD / arrows · E interact · J strike · Space dash · Esc pause</div></div>
<div id="touch" hidden><div id="stick" role="img" aria-label="Movement joystick"><div id="knob"></div></div><div id="actions"><button id="attack">Attack</button><button id="dash" aria-label="Dash skill">Dash</button><button id="interact">Interact</button></div></div>
<div id="overlay" role="dialog" aria-modal="true" aria-labelledby="menu-title" hidden><section id="panel" class="panel"></section></div>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const canvas = $('scene'), ctx = canvas.getContext('2d');
const game = $('game'), panel = $('panel'), overlay = $('overlay');
const media = matchMedia('(pointer: coarse)');
const checkpointKey = 'slopefall.seam.checkpoint.v1';
const settingsKey = 'slopefall.seam.settings.v1';
const initial = {level:0,x:94,y:209,entered:false,b:0,hp:3};
const levels = [
  {
    name:'Lantern Causeway', bounds:[824,400], spawn:[274,209], clue:'Find the lever beside the bridge.',
    bridge:{left:448,right:632,top:155,bottom:265},
    floors:[[34,97,212,320],[194,160,281,258],[266,92,448,330],[632,120,797,309]],
    pillars:[[286,116,306,150],[390,274,416,300],[669,136,690,170],[753,268,775,293]],
    lanterns:[[66,147],[183,191],[240,206],[278,177],[431,270],[655,203],[775,197]],
    lever:[418,151], tablet:[368,160], exit:[741,214],
    traps:[[328,236,36,0,'steam']], foes:[]
  },
  {
    name:'The Spikeworks', bounds:[1090,550], spawn:[88,374], clue:'Take the north passage to the lever.',
    bridge:{left:565,right:820,top:329,bottom:439},
    floors:[[32,270,565,505],[446,230,554,290],[350,86,620,251],[820,265,1060,505]],
    pillars:[[213,278,250,348],[323,408,367,473],[473,124,513,177],[889,274,920,322]],
    lanterns:[[100,315],[186,385],[294,362],[421,306],[505,264],[548,214],[559,126],[546,449],[848,385],[1015,414]],
    lever:[555,128], tablet:[387,126], exit:[999,374],
    traps:[[290,389,42,.5,'steam'],[502,273,42,1.3,'spikes'],[557,205,32,2.1,'spikes'],[916,388,39,2.6,'steam']],
    foes:[[384,360,432,437],[924,338,993,414]]
  },
  {
    name:'The Hollow Vault', bounds:[1540,670], spawn:[99,501], clue:'Follow the lanterns north, then east to the lever vault.',
    bridge:{left:925,right:1235,top:387,bottom:501},
    floors:[[32,390,215,620],[194,440,352,550],[330,292,570,610],[389,155,482,313],[365,65,872,185],[777,162,871,296],[701,275,925,570],[1235,300,1505,605]],
    pillars:[[371,367,411,423],[488,457,547,500],[524,95,569,145],[667,127,710,173],[752,381,799,426],[1361,347,1401,393]],
    lanterns:[[90,444],[197,496],[309,490],[465,390],[438,294],[439,177],[498,110],[612,116],[743,114],[823,166],[823,267],[860,323],[896,456],[1263,452],[1452,470]],
    lever:[872,325], tablet:[732,326], exit:[1446,442],
    traps:[[430,480,45,.8,'spikes'],[431,283,43,1.9,'steam'],[625,123,43,2.3,'spikes'],[824,226,44,.35,'spikes'],[848,389,37,1.1,'steam'],[1332,452,45,2.4,'spikes'],[1409,496,42,1.5,'steam']],
    foes:[[454,361,528,432],[727,94,793,143],[812,467,886,523],[1280,374,1372,436],[1398,435,1465,519]]
  }
];
let level, bridge, seam, floors, pillars, objects, monsters, swing = 0, attackDelay = 0;
function setLevel(index) {
  level = levels[index];
  ({bridge,floors,pillars} = level);
  seam = (bridge.left+bridge.right)/2;
  const object = ([x,y],label) => ({x,y,label});
  objects = {
    lever:object(level.lever,'Adjust bridge lever'),
    tablet:object(level.tablet,'Read stone tablet'),
    [index===levels.length-1?'artifact':'ladder']:object(level.exit,index===levels.length-1?'Retrieve the Ember Lens':'Descend the ladder')
  };
  if (index===0) objects.lantern=object([153,169],'Read lantern marker');
  monsters=level.foes.map(([x,y,toX,toY],i)=>({x,y,fromX:x,fromY:y,toX,toY,phase:i,wind:0,lunge:0,rest:.5,hp:index}));
}
function floorCheckpoint(index,b) {
  const {spawn,lever}=levels[index];
  const [x,y]=b===1 ? [lever[0],lever[1]+21] : spawn;
  return {level:index,x,y,entered:true,b,hp:3};
}
const movement = {KeyA:[-1,0],ArrowLeft:[-1,0],KeyD:[1,0],ArrowRight:[1,0],KeyW:[0,-1],ArrowUp:[0,-1],KeyS:[0,1],ArrowDown:[0,1]};
const keys = new Set();
const stick = {id:null,x:0,y:0};
const clamp = (n,min,max) => Math.max(min,Math.min(max,n));
const distance = (x,y,o) => Math.hypot(x-o.x,y-o.y);
let player, view = 'title', backView = 'title', infoBack = 'play', confirmAction;
let elapsed = 0, cooldown = 0, dashTime = 0, dx = 1, dy = 0, heading = [1,0], safeTime = 0;
let deckHeight = 2, sparks = [], notice = '', noticeTime = 0, walking = false;
let lastFrame = 0, touchMode = media.matches, zoom = 1, camX = 0, camY = 0;
let saved = read(checkpointKey), prefs = read(settingsKey) || {};
let settings = {music:volume(prefs.music,.26),sfx:volume(prefs.sfx,.58)};
let audio, musicGain, effectsGain, noteIndex = 0, musicActive = false;
const notes = [146.83,0,220,0,261.63,220,0,196,130.81,0,196,0,246.94,196,0,164.81];

function read(key) {
  try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
}
function write(key,value) {
  try { localStorage.setItem(key,JSON.stringify(value)); return true; } catch { return false; }
}
function volume(n,fallback) { return Number.isFinite(n) ? clamp(n,0,1) : fallback; }
function validSave(s) {
  const index=s?.level ?? 0;
  return s?.entered===true && Number.isInteger(index) && index>=0 && index<levels.length && (s.b===0 || s.b===1);
}
saved = validSave(saved) ? floorCheckpoint(saved.level ?? 0,saved.b) : null;
function saveCheckpoint(b) {
  saved = floorCheckpoint(player.level,b);
  if (!write(checkpointKey,saved)) announce('Checkpoint saved for this tab.');
}
function bridgeHeights(b) {
  const leftLimit = 2 + 1;
  const rightLimit = 2 + b;
  const atSeam = 2 + b;
  return {leftLimit,rightLimit,atSeam,continuous:leftLimit === rightLimit && rightLimit === atSeam};
}
function aligned() {
  const heights = bridgeHeights(player.b);
  return heights.continuous && Math.abs(deckHeight-heights.rightLimit) < .001;
}
function reset(state) {
  player = {...state};
  setLevel(player.level);
  swing = attackDelay = 0;
  elapsed = cooldown = dashTime = safeTime = 0;
  deckHeight = bridgeHeights(player.b).rightLimit;
  heading = [1,0];
  sparks = [];
  notice = '';
  walking = false;
  clearInput();
}
function announce(text) { notice = text; noticeTime = 3.4; }
function clearInput() {
  keys.clear();
  stick.id = null;
  stick.x = stick.y = 0;
  $('knob').style.transform = '';
}
function setTouch(value) {
  touchMode = value;
  document.body.classList.toggle('touch',value);
  clearInput();
  resize();
}
function note(bus,frequency,duration,level,type='sine') {
  if (!audio || audio.state !== 'running') return;
  const start = audio.currentTime, osc = audio.createOscillator(), envelope = audio.createGain();
  osc.type = type;
  osc.frequency.value = frequency;
  envelope.gain.setValueAtTime(.001,start);
  envelope.gain.exponentialRampToValueAtTime(level,start+.035);
  envelope.gain.exponentialRampToValueAtTime(.001,start+duration);
  osc.connect(envelope).connect(bus);
  osc.start(start);
  osc.stop(start+duration+.01);
}
function playMusic() {
  const Context = window.AudioContext || window.webkitAudioContext;
  if (!Context) return;
  if (!audio) {
    audio = new Context();
    musicGain = audio.createGain();
    effectsGain = audio.createGain();
    musicGain.connect(audio.destination);
    effectsGain.connect(audio.destination);
    applyVolumes();
    setInterval(() => {
      if (audio.state !== 'running' || document.hidden || !musicActive) return;
      const frequency = notes[noteIndex % notes.length];
      if (frequency) note(musicGain,frequency,.56,.15,'triangle');
      if (noteIndex % 4 === 0) note(musicGain,notes[noteIndex < 8 ? 0 : 8]/2,1.3,.18);
      noteIndex = (noteIndex+1)%notes.length;
    },360);
  }
  musicActive = true;
  audio.resume().catch(()=>{});
}
function applyVolumes() {
  if (!audio) return;
  musicGain.gain.setTargetAtTime(settings.music,audio.currentTime,.015);
  effectsGain.gain.setTargetAtTime(settings.sfx,audio.currentTime,.015);
}
function cue(frequency) { if (effectsGain) note(effectsGain,frequency,.22,.22,'triangle'); }
function start(state) {
  reset(state);
  playMusic();
  change('play');
  announce(state.entered ? 'Checkpoint restored.' : 'Try moving, then read the lantern marker.');
}

function change(next) {
  view = next;
  overlay.classList.toggle('home', next === 'title');
  if (next === 'title') musicActive = false;
  clearInput();
  const live = next === 'play';
  overlay.hidden = live;
  $('hud').hidden = $('status').hidden = $('touch').hidden = !live;
  if (live) {
    if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
    return;
  }
  drawMenu();
}
function menu(title,body,buttons,eyebrow='SLOPEFALL / THE SEAM OF ASH') {
  panel.className = 'panel';
  panel.innerHTML = '<div class="tag">'+eyebrow+'</div>'+title+body+'<div class="panel-menu"></div>';
  const list = panel.querySelector('.panel-menu');
  for (const [label,action,primary,disabled] of buttons) {
    const button = document.createElement('button');
    button.textContent = label;
    button.disabled = Boolean(disabled);
    if (primary) button.className = 'primary';
    button.onclick = action;
    list.append(button);
  }
  list.querySelector('button:not(:disabled)')?.focus({preventScroll:true});
}
function openSettings() { backView = view; change('settings'); }
function openAbout() { backView = view; change('about'); }
function confirmProgress(title,text,action) {
  confirmAction = {title,text,action,back:view};
  change('confirm');
}
function newGame() {
  if (saved) confirmProgress('Start over?','This replaces the current checkpoint.',() => {
    saved = null;
    try { localStorage.removeItem(checkpointKey); } catch {}
    start(initial);
  });
  else start(initial);
}
function drawMenu() {
  const heading = text => '<h2 id="menu-title">'+text+'</h2>';
  if (view === 'title') {
    menu('<h1 id="menu-title">Slopefall</h1>','<div class="subtitle">The Seam of Ash</div><p>Carry the lantern into the Hollow Vault. Mend the crossings and bring back the Ember Lens.</p>',[
      ['New Game',newGame,true],['Continue',()=>start(saved),false,!saved],['Settings',openSettings],['About',openAbout]
    ],'A dungeon adventure');
  } else if (view === 'pause') {
    menu(heading('Paused'),'<p>Your lantern will keep burning.</p>',[
      ['Resume',()=>change('play'),true],
      ['Continue from Checkpoint',()=>confirmProgress('Reload checkpoint?','You will lose progress made since the last checkpoint.',()=>start(saved)),false,!saved],
      ['Settings',openSettings],['About',openAbout],
      ['Home / Exit to Title',()=>confirmProgress('Return to title?','Progress since your last checkpoint will be lost.',()=>{reset(initial);change('title');})]
    ]);
  } else if (view === 'confirm') {
    menu(heading(confirmAction.title),'<p>'+confirmAction.text+'</p>',[
      ['Cancel',()=>change(confirmAction.back),true],['Confirm',confirmAction.action]
    ]);
  } else if (view === 'settings') {
    menu(heading('Settings'),'<label>Music <output id="music-out"></output><input id="music" type="range" min="0" max="100" aria-label="Music volume"></label><label>Effects <output id="sfx-out"></output><input id="sfx" type="range" min="0" max="100" aria-label="Effects volume"></label><p id="fullscreen-note" role="status"></p>',[
      [document.fullscreenElement ? 'Exit Fullscreen' : 'Enter Fullscreen',toggleFullscreen],
      ['Back',()=>change(backView),true]
    ]);
    for (const key of ['music','sfx']) {
      const slider = $(key), output = $(key+'-out');
      slider.value = Math.round(settings[key]*100);
      output.textContent = slider.value === '0' ? 'Muted' : slider.value+'%';
      slider.oninput = () => {
        settings[key] = Number(slider.value)/100;
        output.textContent = slider.value === '0' ? 'Muted' : slider.value+'%';
        applyVolumes();
        write(settingsKey,settings);
      };
      if (key === 'sfx') slider.onchange = () => cue(440);
    }
  } else if (view === 'about') {
    menu(heading('About'),'<p>A three-floor ruin adventure for MATH 101. Repair each bridge, take the ladders down, and recover the Ember Lens.</p><p><strong>Desktop</strong> · WASD or arrows to move, E to interact, J to strike, Space to dash, Esc to pause or go back.</p><p><strong>Touch</strong> · Use the left thumbstick and tap Attack, Dash, or Interact with the other thumb.</p><p><strong>Calculus</strong> · A crossing is continuous when the two one-sided limits agree with the height at the join.</p><p><strong>Credits</strong> · Original sprites, map, effects, and synthesized score created for Slopefall. Lesson reference: MATH 101, Chapter 4, Limits and Continuity.</p>',[
      ['Back',()=>change(backView),true]
    ]);
  } else if (view === 'lever') {
    menu(heading('Bridge lever'),'<p>Raise or lower the far deck. Watch the two edge markers meet.</p><p id="bridge-state" role="status"></p>',[
      ['Back to crossing',()=>change('play'),true],['How it works',()=>{infoBack='lever';change('math');}]
    ]);
    panel.classList.add('lever-panel');
    const dial = document.createElement('div');
    dial.className = 'dial';
    dial.setAttribute('aria-label','Bridge height settings');
    for (const b of [0,1,2]) {
      const button = document.createElement('button');
      button.textContent = 'b = '+b;
      button.setAttribute('aria-pressed',String(player.b === b));
      button.onclick = () => {
        setLever(b);
        for (const option of dial.children) option.setAttribute('aria-pressed',String(option === button));
      };
      dial.append(button);

  rect(x-6,baseY-2+stride,4,6,'#15242b');
  rect(x+2,baseY-2-stride,4,6,'#15242b');
  rect(x-8,baseY-12,16,12,'#345c62');
  rect(x-5,baseY-11,10,10,'#4c8580');
  rect(x-7,baseY-20,14,10,'#9ac7b4');
  rect(x-5,baseY-22,10,4,'#c0dfc7');
  rect(x+(heading[0]<0?-6:0),baseY-16,6,3,'#24373c');
  rect(x+6,baseY-9,5,6,'#f0be82');
  ctx.restore();
  if(swing>0) {
    const angle=Math.atan2(heading[1],heading[0]);
    ctx.strokeStyle='#c4f1d4';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(x,baseY-6,32,angle-.76,angle+.76);ctx.stroke();
  }
}
function render() {
  camera();
  ctx.setTransform(1,0,0,1,0,0);
  rect(0,0,canvas.width,canvas.height,['#0e161e','#19171c','#15131f'][player.level]);
  ctx.setTransform(zoom,0,0,zoom,-camX*zoom,-camY*zoom);
  for(let i=0;i<126;i++){
    const x=seed(i*39+10)*(level.bounds[0]+56)-25,y=seed(i*61+9)*level.bounds[1];
    polygon([[x-12,y+5],[x-6,y-11],[x+3,y-19],[x+13,y+5]],i%3===0?'#17252b':'#121d24');
  }
  floors.forEach(drawFloor);
  pillars.forEach(drawPillar);
  drawBridge();
  level.traps.forEach(drawTrap);
  drawObjects();
  monsters.forEach(drawMonster);
  for(const s of sparks) rect(s.x,s.y,2,2,s.color);
  drawPlayer();
  if(view==='play'){
    const near=nearObject();
    $('zone').textContent='B'+(player.level+1)+' / '+(!player.entered?'Lantern Camp':level.name);
    $('goal').textContent=!player.entered?'Follow the lanterns into the ruins.':!aligned()?level.clue:objects.ladder?'Cross the bridge and descend the ladder.':'Cross and retrieve the Ember Lens.';
    $('hp').textContent='♥'.repeat(player.hp)+'♡'.repeat(3-player.hp);
    $('skill-state').textContent=cooldown>0?'Dash '+cooldown.toFixed(1)+'s':'Dash ready';
    $('dash').disabled=cooldown>0;
    $('attack').disabled=attackDelay>0;
    $('interact').disabled=!near;
    $('prompt').textContent=near?(touchMode?'Interact':'[E]')+' · '+near[1].label:'';
    $('notice').textContent=noticeTime>0?notice:'';
  }
}
function frame(now) {
  const dt=Math.min(.033,Math.max(0,(now-lastFrame)/1000));
  lastFrame=now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
reset(initial);
setTouch(touchMode);
change('title');
requestAnimationFrame(frame);
</script>
</body>
</html>
